<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/modernist-2fe25cee-2cde-4b3d-9036-6ae69afc74be/styles.css"><script src="_ds/modernist-2fe25cee-2cde-4b3d-9036-6ae69afc74be/_ds_bundle.js"></script><style>a{color:inherit;text-decoration:none}a:hover{color:var(--color-accent)}</style></helmet>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<header style="display:flex;align-items:stretch;height:76px;background:var(--color-bg);border-bottom:2px solid var(--color-divider);font-family:var(--font-body);color:var(--color-text)">
  <a href="/" aria-label="Desatascos Levante 24 · Inicio" style="display:flex;align-items:center;gap:12px;padding:0 48px;border-right:2px solid var(--color-divider);color:var(--color-text)">
    <span style="width:40px;height:40px;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square"><path d="M4 4v9a7 7 0 0 0 7 7h9v-6h-8a2 2 0 0 1-2-2V4M2 4h10m8 8v10"></path></svg></span>
    <span style="display:flex;flex-direction:column;gap:3px;line-height:1"><span style="font-size:10px;letter-spacing:.26em;font-weight:600">DESATASCOS</span><span style="font-size:22px;font-weight:800;letter-spacing:-.02em">LEVANTE <span style="color:var(--color-accent)">24</span></span></span>
  </a>
  <nav aria-label="Navegación principal" style="display:flex;align-items:center;gap:36px;padding:0 40px;font-size:15px;font-weight:600">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="color:{{ l.color }};padding:8px 0;border-bottom:2px solid {{ l.rule }}">{{ l.label }}</a></sc-for>
  </nav>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 28px;border-left:2px solid var(--color-divider);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase"><span style="width:8px;height:8px;background:var(--color-accent);display:inline-block"></span>24 h · 365 días</div>
  <a href="#whatsapp" class="btn" style="border-radius:0;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 28px;border-left:2px solid var(--color-divider);font-size:15px;font-weight:800">
    <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"></path></svg>WhatsApp</a>
  <a href="#llamar" class="btn btn-primary" style="border-radius:0;width:240px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 28px;font-size:17px;font-weight:800">
    <svg width="22" height="22" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"></path></svg>Llamar 24 h</a>
</header>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<header style="position:relative;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)">
  <div style="display:flex;align-items:stretch;height:64px;border-bottom:2px solid var(--color-divider)">
    <a href="/" aria-label="Desatascos Levante 24 · Inicio" style="display:flex;align-items:center;gap:10px;padding:0 20px;flex:1">
      <span style="width:32px;height:32px;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center"><svg width="19" height="19" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square"><path d="M4 4v9a7 7 0 0 0 7 7h9v-6h-8a2 2 0 0 1-2-2V4M2 4h10m8 8v10"></path></svg></span>
      <span style="display:flex;flex-direction:column;gap:2px;line-height:1"><span style="font-size:8px;letter-spacing:.26em;font-weight:600">DESATASCOS</span><span style="font-size:18px;font-weight:800;letter-spacing:-.02em">LEVANTE <span style="color:var(--color-accent)">24</span></span></span>
    </a>
    <a href="#llamar" class="btn btn-primary" style="border-radius:0;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:15px;font-weight:800">
      <svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"></path></svg>Llamar</a>
    <button aria-label="{{ menuLabel }}" onClick="{{ toggle }}" style="width:64px;border:0;border-left:2px solid var(--color-divider);background:transparent;color:var(--color-text);display:grid;place-items:center;cursor:pointer">
      <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></sc-if>
      <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square"><path d="m6 6 12 12M6 18 18 6"></path></svg></sc-if>
    </button>
  </div>
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
  <nav aria-label="Navegación principal" style="position:absolute;top:64px;left:0;right:0;z-index:20;background:var(--color-bg);border-bottom:2px solid var(--color-divider);box-shadow:var(--shadow-lg)">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:2px solid var(--color-divider);font-size:26px;font-weight:800;letter-spacing:-.02em;color:{{ l.color }}">{{ l.label }}<svg width="22" height="22" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square"><path d="M4 12h16m-6-6 6 6-6 6"></path></svg></a></sc-for>
    <div style="display:grid;grid-template-columns:1fr 1fr">
      <a href="#llamar" class="btn btn-primary" style="border-radius:0;justify-content:flex-start;height:64px;padding:0 20px;font-size:17px;font-weight:800">Llamar 24 h</a>
      <a href="#whatsapp" class="btn" style="border-radius:0;justify-content:flex-start;height:64px;padding:0 20px;font-size:17px;font-weight:800;border-left:2px solid var(--color-divider)">WhatsApp</a>
    </div>
    <p style="margin:0;padding:14px 20px;font-size:13px;color:var(--color-neutral-700);border-top:2px solid var(--color-divider)">Provincia de Alicante · 24 horas, 365 días</p>
  </nav>
  </sc-if>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;desatascos&quot;,&quot;camara&quot;,&quot;zonas&quot;,&quot;contacto&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const mobile = !!this.props.mobile;
    const open = this.state.open ?? !!this.props.open;
    const active = this.props.active ?? '';
    const links = [
      ['/servicios/desatascos-24-horas/', 'Desatascos 24 h', 'desatascos'],
      ['/servicios/inspeccion-camara-tuberias/', 'Inspección con cámara', 'camara'],
      ['/zonas/', 'Zonas', 'zonas'],
      ['/contacto/', 'Contacto', 'contacto'],
    ].map(([href, label, key]) => ({ href, label, color: key === active ? 'var(--color-accent)' : 'var(--color-text)', rule: key === active ? 'var(--color-accent)' : 'transparent' }));
    return { desktop: !mobile, mobile, isOpen: mobile && open, closed: !open, menuLabel: open ? 'Cerrar menú' : 'Abrir menú', links, toggle: () => this.setState({ open: !open }) };
  }
}
</script>
</body>
</html>
